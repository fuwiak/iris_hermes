# Railway deploy — slim dashboard image (Dockerfile.railway).
# Persist state via Railway Volume mounted at /opt/data (HERMES_HOME).
# Public URL: https://hermes-agent-pasha-production.up.railway.app

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
