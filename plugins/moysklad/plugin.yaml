name: moysklad
version: 1.10.0
description: "МойСклад Remap 1.2 — Clients + Campaigns + AI fill empty fields (green markers), tools. Enabled by default on Iris. Token: MOYSKLAD_API_TOKEN."
author: Hermes Agent
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - moysklad_health
  - moysklad_counterparties
  - moysklad_orders
  - moysklad_positions
  - moysklad_channels
  - moysklad_push_tags
  - moysklad_clients_by_sales_type
requires_env:
  - name: MOYSKLAD_API_TOKEN
    description: "MoySklad Remap 1.2 Bearer API token"
    prompt: "MoySklad API token"
    url: "https://www.moysklad.ru/"
    password: true
optional_env:
  - name: MOYSKLAD_API_URL
    description: "Remap base URL (default https://api.moysklad.ru/api/remap/1.2)"
    prompt: "MoySklad API URL"
    password: false
  - name: MOYSKLAD_CACHE_TTL_SECONDS
    description: "Clients catalog cache TTL in seconds (default 21600 = 6h). Refresh via Синхронизация or when expired."
    prompt: "MoySklad cache TTL seconds"
    password: false
  - name: ELASTICSEARCH_URL
    description: "Optional Elasticsearch URL for durable Clients/Дашборд cache (index moysklad-cache). Falls back to Redis then $HERMES_HOME/moysklad/cache/."
    prompt: "Elasticsearch URL"
    password: false
  - name: REDIS_URL
    description: "Optional Redis URL for durable Clients cache (falls back to $HERMES_HOME/moysklad/cache/)."
    prompt: "Redis URL"
    password: false
  - name: MOYSKLAD_TELEGRAM_BOT_TOKEN
    description: "Legacy alias for TELEGRAM_BUSINESS_BOT_TOKEN. Prefer Office → Telegram Business."
    prompt: "MoySklad Telegram Business bot token (legacy)"
    password: true
  - name: MOYSKLAD_TELEGRAM_BOT_USERNAME
    description: "Legacy display username; prefer TELEGRAM_BUSINESS_BOT_USERNAME."
    prompt: "MoySklad Telegram bot username (legacy)"
    password: false
  - name: MOYSKLAD_TELEGRAM_BUSINESS_CONNECTION_ID
    description: "Legacy alias for TELEGRAM_BUSINESS_CONNECTION_ID. Prefer Office → Telegram Business."
    prompt: "Telegram business_connection_id (legacy)"
    password: false
