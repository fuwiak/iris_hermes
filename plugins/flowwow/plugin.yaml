name: flowwow
version: 0.2.0
description: "Flowwow seller API — shops + products read tools (verified live, apis.flowwow.com). Opt-in, off by default. Token: FLOWWOW_API_TOKEN."
author: Hermes Agent
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - flowwow_health
  - flowwow_shops
  - flowwow_products
requires_env:
  - name: FLOWWOW_API_TOKEN
    description: "Flowwow seller API bearer token (issued by Flowwow support / seller cabinet)"
    prompt: "Flowwow API token"
    url: "https://flowwow.com/"
    password: true
optional_env:
  - name: FLOWWOW_API_URL
    description: "Flowwow API base URL override (default https://apis.flowwow.com)"
    prompt: "Flowwow API URL"
    password: false
  - name: FLOWWOW_REQUEST_DELAY_MS
    description: "Delay between paginated requests in ms (default 250)"
    prompt: "Flowwow request delay ms"
    password: false
  - name: FLOWWOW_API_RETRY_MAX
    description: "Max retries on 429/5xx (default 4)"
    prompt: "Flowwow API retry max"
    password: false
