name: Deploy Iris Hermes to Selectel

# Only auto-workflow on this Iris fork: every push to main deploys.
# Heavy CI / lint / JS tests are workflow_dispatch-only so they do not
# burn Actions minutes or block this job.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-selectel-iris
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to VDS over SSH
        env:
          SELECTEL_HOST: ${{ secrets.SELECTEL_IRIS_HOST }}
          SELECTEL_USER: ${{ secrets.SELECTEL_IRIS_USER }}
          SELECTEL_SSH_KEY: ${{ secrets.SELECTEL_IRIS_SSH_KEY }}
          DEPLOY_ENV: ${{ secrets.SELECTEL_IRIS_DEPLOY_ENV }}
          # Optional: rotate OpenRouter without rewriting full DEPLOY_ENV body.
          OPENROUTER_API_KEY: ${{ secrets.SELECTEL_IRIS_OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SELECTEL_HOST:-}"
          test -n "${SELECTEL_USER:-}"
          test -n "${SELECTEL_SSH_KEY:-}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SELECTEL_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SELECTEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH=(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes)

          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'graphify-out' \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            ./ "${SELECTEL_USER}@${SELECTEL_HOST}:/opt/iris_hermes/"

          if [ -n "${DEPLOY_ENV:-}" ]; then
            printf '%s\n' "$DEPLOY_ENV" | "${SSH[@]}" \
              "${SELECTEL_USER}@${SELECTEL_HOST}" 'cat > /root/deploy.env'
          fi

          # Patch OpenRouter key into /root/deploy.env (volume synced on hermes boot).
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            printf '%s' "$OPENROUTER_API_KEY" | "${SSH[@]}" \
              "${SELECTEL_USER}@${SELECTEL_HOST}" \
              'set -euo pipefail
               test -f /root/deploy.env
               umask 077
               cat > /tmp/iris_or_key
               export OPENROUTER_API_KEY="$(cat /tmp/iris_or_key)"
               rm -f /tmp/iris_or_key
               python3 /opt/iris_hermes/scripts/sync_moysklad_env_from_railway.py \
                 --prefer-process-env --env-file /root/deploy.env'
          fi

          "${SSH[@]}" "${SELECTEL_USER}@${SELECTEL_HOST}" \
            'bash /opt/iris_hermes/deploy/selectel/remote_deploy.sh'

      - name: Health summary
        run: |
          echo "Target: https://hermes-agent-ai.ru" >> "$GITHUB_STEP_SUMMARY"
          echo "VDS: ${{ secrets.SELECTEL_IRIS_HOST }}" >> "$GITHUB_STEP_SUMMARY"
