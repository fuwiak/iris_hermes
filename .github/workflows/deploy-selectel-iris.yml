name: Deploy Iris Hermes to Selectel

# Only auto-workflow on this Iris fork: every push to main deploys.
# Heavy CI / lint / JS tests are workflow_dispatch-only so they do not
# burn Actions minutes or block this job.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-selectel-iris
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to VDS over SSH
        env:
          SELECTEL_HOST: ${{ secrets.SELECTEL_IRIS_HOST }}
          SELECTEL_USER: ${{ secrets.SELECTEL_IRIS_USER }}
          SELECTEL_SSH_KEY: ${{ secrets.SELECTEL_IRIS_SSH_KEY }}
          DEPLOY_ENV: ${{ secrets.SELECTEL_IRIS_DEPLOY_ENV }}
          # Optional: rotate OpenRouter without rewriting full DEPLOY_ENV body.
          OPENROUTER_API_KEY: ${{ secrets.SELECTEL_IRIS_OPENROUTER_API_KEY }}
          # Railway egress (non-RU IP). Prefer telegram-user-egress when
          # openrouter-egress edge TLS-hangs from Yandex/Selectel VDS.
          OPENROUTER_BASE_URL: ${{ secrets.SELECTEL_IRIS_OPENROUTER_BASE_URL }}
          # Telegram Business outreach for MoySklad Рассылки (optional patch).
          MOYSKLAD_TELEGRAM_BOT_TOKEN: ${{ secrets.SELECTEL_IRIS_MOYSKLAD_TELEGRAM_BOT_TOKEN }}
          MOYSKLAD_TELEGRAM_BOT_USERNAME: ${{ secrets.SELECTEL_IRIS_MOYSKLAD_TELEGRAM_BOT_USERNAME }}
          MOYSKLAD_TELEGRAM_BUSINESS_CONNECTION_ID: ${{ secrets.SELECTEL_IRIS_MOYSKLAD_TELEGRAM_BUSINESS_CONNECTION_ID }}
          # Personal MTProto (Telethon) — api_id/api_hash stay server-side.
          TELEGRAM_API_ID: ${{ secrets.SELECTEL_IRIS_TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.SELECTEL_IRIS_TELEGRAM_API_HASH }}
          # Railway Telethon egress (non-RU IP). See deploy/telegram-user-egress/.
          TELEGRAM_USER_GATEWAY_URL: ${{ secrets.SELECTEL_IRIS_TELEGRAM_USER_GATEWAY_URL }}
          # Marketplace tokens for the «Карточки» tab (optional patch).
          FLOWWOW_API_TOKEN: ${{ secrets.SELECTEL_IRIS_FLOWWOW_API_TOKEN }}
          YANDEX_MARKET_API_TOKEN: ${{ secrets.SELECTEL_IRIS_YANDEX_MARKET_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SELECTEL_HOST:-}"
          test -n "${SELECTEL_USER:-}"
          test -n "${SELECTEL_SSH_KEY:-}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SELECTEL_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SELECTEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH=(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ConnectTimeout=30)

          # Yandex uses non-root `deploy` + sudo; Selectel was root.
          # Docker / prior root deploys leave root-owned trees — chown must
          # succeed before rsync or mkstemp dies with Permission denied (13).
          "${SSH[@]}" "${SELECTEL_USER}@${SELECTEL_HOST}" \
            'set -euo pipefail
             sudo mkdir -p /opt/iris_hermes /opt/data
             sudo chown -R "$(id -un):$(id -gn)" /opt/iris_hermes /opt/data
             test -w /opt/iris_hermes
             touch /opt/iris_hermes/.deploy_write_ok && rm -f /opt/iris_hermes/.deploy_write_ok
            '

          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'graphify-out' \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ConnectTimeout=30" \
            ./ "${SELECTEL_USER}@${SELECTEL_HOST}:/opt/iris_hermes/"

          if [ -n "${DEPLOY_ENV:-}" ]; then
            printf '%s\n' "$DEPLOY_ENV" | "${SSH[@]}" \
              "${SELECTEL_USER}@${SELECTEL_HOST}" \
              'sudo tee /root/deploy.env >/dev/null && sudo chmod 600 /root/deploy.env'
          fi

          # Patch rotating secrets into /root/deploy.env (volume synced on hermes boot).
          PATCH_FILE=$(mktemp)
          umask 077
          : >"$PATCH_FILE"
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >>"$PATCH_FILE"
          fi
          if [ -n "${OPENROUTER_BASE_URL:-}" ]; then
            printf 'OPENROUTER_BASE_URL=%s\n' "$OPENROUTER_BASE_URL" >>"$PATCH_FILE"
          fi
          if [ -n "${MOYSKLAD_TELEGRAM_BOT_TOKEN:-}" ]; then
            printf 'MOYSKLAD_TELEGRAM_BOT_TOKEN=%s\n' "$MOYSKLAD_TELEGRAM_BOT_TOKEN" >>"$PATCH_FILE"
          fi
          if [ -n "${MOYSKLAD_TELEGRAM_BOT_USERNAME:-}" ]; then
            printf 'MOYSKLAD_TELEGRAM_BOT_USERNAME=%s\n' "$MOYSKLAD_TELEGRAM_BOT_USERNAME" >>"$PATCH_FILE"
          fi
          if [ -n "${MOYSKLAD_TELEGRAM_BUSINESS_CONNECTION_ID:-}" ]; then
            printf 'MOYSKLAD_TELEGRAM_BUSINESS_CONNECTION_ID=%s\n' "$MOYSKLAD_TELEGRAM_BUSINESS_CONNECTION_ID" >>"$PATCH_FILE"
          fi
          if [ -n "${TELEGRAM_API_ID:-}" ]; then
            printf 'TELEGRAM_API_ID=%s\n' "$TELEGRAM_API_ID" >>"$PATCH_FILE"
          fi
          if [ -n "${TELEGRAM_API_HASH:-}" ]; then
            printf 'TELEGRAM_API_HASH=%s\n' "$TELEGRAM_API_HASH" >>"$PATCH_FILE"
          fi
          if [ -n "${TELEGRAM_USER_GATEWAY_URL:-}" ]; then
            printf 'TELEGRAM_USER_GATEWAY_URL=%s\n' "$TELEGRAM_USER_GATEWAY_URL" >>"$PATCH_FILE"
          fi
          if [ -n "${FLOWWOW_API_TOKEN:-}" ]; then
            printf 'FLOWWOW_API_TOKEN=%s\n' "$FLOWWOW_API_TOKEN" >>"$PATCH_FILE"
          fi
          if [ -n "${YANDEX_MARKET_API_TOKEN:-}" ]; then
            printf 'YANDEX_MARKET_API_TOKEN=%s\n' "$YANDEX_MARKET_API_TOKEN" >>"$PATCH_FILE"
          fi
          printf 'TELEGRAM_ENABLED=false\n' >>"$PATCH_FILE"
          if [ -s "$PATCH_FILE" ]; then
            scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ConnectTimeout=30 \
              "$PATCH_FILE" "${SELECTEL_USER}@${SELECTEL_HOST}:/tmp/iris_deploy_patch.env"
            # Merge via --patch-file under sudo. Do NOT `source` then `sudo python`:
            # sudo env_reset drops OPENROUTER_BASE_URL and chat falls back to
            # openrouter.ai → HTTP 403 from the RU/Yandex egress IP.
            "${SSH[@]}" "${SELECTEL_USER}@${SELECTEL_HOST}" \
              'set -euo pipefail
               sudo test -f /root/deploy.env
               test -f /tmp/iris_deploy_patch.env
               sudo python3 /opt/iris_hermes/scripts/sync_moysklad_env_from_railway.py \
                 --patch-file /tmp/iris_deploy_patch.env --env-file /root/deploy.env
               sudo python3 /opt/iris_hermes/scripts/patch_deploy_telegram_enabled.py
               rm -f /tmp/iris_deploy_patch.env
               '
          fi
          rm -f "$PATCH_FILE"

          "${SSH[@]}" "${SELECTEL_USER}@${SELECTEL_HOST}" \
            'sudo bash /opt/iris_hermes/deploy/selectel/remote_deploy.sh'

      - name: Health summary
        run: |
          echo "Target: http://158.160.195.2 (Yandex) / https://hermes-agent-ai.ru after DNS" >> "$GITHUB_STEP_SUMMARY"
          echo "VDS: ${{ secrets.SELECTEL_IRIS_HOST }}" >> "$GITHUB_STEP_SUMMARY"
