name: Probe Iris dashboard login

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check username + admin/admin on VDS
        env:
          HOST: ${{ secrets.SELECTEL_IRIS_HOST }}
          USER: ${{ secrets.SELECTEL_IRIS_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_IRIS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH=(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ConnectTimeout=45)
          "${SSH[@]}" "${USER}@${HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== container ==="
          docker ps --format "{{.Names}} {{.Status}} {{.Ports}}" | grep hermes || true
          echo "=== configured username (no password dump) ==="
          docker exec selectel-hermes-1 python3 - <<'PY'
          import os
          u = os.environ.get("HERMES_DASHBOARD_BASIC_AUTH_USERNAME") or ""
          p = os.environ.get("HERMES_DASHBOARD_BASIC_AUTH_PASSWORD") or ""
          print(f"USERNAME={u!r}")
          print(f"PASSWORD_LEN={len(p)}")
          print(f"PASSWORD_IS_admin={p == 'admin'}")
          print(f"PASSWORD_IS_EMPTY={not bool(p)}")
          PY
          echo "=== localhost /api/status ==="
          curl -sS -m 10 http://127.0.0.1:8080/api/status | head -c 500 || echo STATUS_FAIL
          echo
          echo "=== localhost login probe admin/admin ==="
          code=$(curl -sS -m 10 -o /tmp/login_body.json -w "%{http_code}" -X POST http://127.0.0.1:8080/auth/password-login \
            -H "Content-Type: application/json" \
            -d '{"provider":"basic","username":"admin","password":"admin","next":"/chat"}' || echo fail)
          echo "HTTP=$code body=$(head -c 200 /tmp/login_body.json 2>/dev/null || true)"
          REMOTE
