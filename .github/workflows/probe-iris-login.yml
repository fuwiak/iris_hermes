name: Probe Iris dashboard login

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check username + admin/admin on VDS
        env:
          HOST: ${{ secrets.SELECTEL_IRIS_HOST }}
          USER: ${{ secrets.SELECTEL_IRIS_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_IRIS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH=(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ConnectTimeout=45)
          "${SSH[@]}" "${USER}@${HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== container ==="
          docker ps --format "{{.Names}} {{.Status}}" | grep hermes || true
          echo "=== configured username (password redacted) ==="
          docker exec selectel-hermes-1 sh -c '
            echo "USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-<unset>}"
            if [ -n "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}" ]; then echo "PASSWORD_SET=yes len=${#HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}"; else echo "PASSWORD_SET=no"; fi
            if [ -n "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH:-}" ]; then echo "PASSWORD_HASH_SET=yes"; else echo "PASSWORD_HASH_SET=no"; fi
          '
          echo "=== localhost login probe admin/admin ==="
          code=$(curl -sS -m 10 -o /tmp/login_body.json -w "%{http_code}" -X POST http://127.0.0.1:8080/auth/password-login \
            -H "Content-Type: application/json" \
            -d "{\"provider\":\"basic\",\"username\":\"admin\",\"password\":\"admin\",\"next\":\"/chat\"}" || echo fail)
          echo "HTTP=$code body=$(head -c 200 /tmp/login_body.json 2>/dev/null || true)"
          REMOTE
