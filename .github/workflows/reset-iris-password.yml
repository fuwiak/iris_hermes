name: Reset Iris dashboard password

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: "New HERMES_DASHBOARD_BASIC_AUTH_PASSWORD"
        required: true
        default: "adminadmin"

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set password on VDS and verify login
        env:
          HOST: ${{ secrets.SELECTEL_IRIS_HOST }}
          USER: ${{ secrets.SELECTEL_IRIS_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_IRIS_SSH_KEY }}
          NEW_PASSWORD: ${{ inputs.new_password }}
        run: |
          set -euo pipefail
          test -n "${NEW_PASSWORD}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH=(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ConnectTimeout=45)

          printf '%s' "$NEW_PASSWORD" | "${SSH[@]}" "${USER}@${HOST}" \
            'cat > /tmp/iris_new_pw && chmod 600 /tmp/iris_new_pw'

          "${SSH[@]}" "${USER}@${HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -f /tmp/iris_new_pw
          sudo python3 - <<'PY'
          from pathlib import Path
          pw = Path("/tmp/iris_new_pw").read_text(encoding="utf-8")
          for path in (
              Path("/root/deploy.env"),
              Path("/opt/iris_hermes/deploy/selectel/.env"),
          ):
              if not path.is_file():
                  print(f"skip missing {path}")
                  continue
              lines = path.read_text(encoding="utf-8").splitlines()
              out, hit_pw, hit_user = [], False, False
              for line in lines:
                  if line.startswith("HERMES_DASHBOARD_BASIC_AUTH_PASSWORD="):
                      out.append("HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=" + pw)
                      hit_pw = True
                  elif line.startswith("HERMES_DASHBOARD_BASIC_AUTH_USERNAME="):
                      out.append("HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin")
                      hit_user = True
                  else:
                      out.append(line)
              if not hit_user:
                  out.append("HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin")
              if not hit_pw:
                  out.append("HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=" + pw)
              path.write_text("\n".join(out) + "\n", encoding="utf-8")
              print(f"patched {path}")
          PY

          cd /opt/iris_hermes/deploy/selectel
          sudo docker compose up -d --force-recreate --no-build hermes

          echo "waiting for dashboard…"
          ok=0
          for i in $(seq 1 40); do
            if curl -sf -m 3 http://127.0.0.1:8080/api/status >/dev/null 2>&1; then
              echo "dashboard up attempt=$i"
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

          BODY=$(python3 - <<'PY'
          import json
          from pathlib import Path
          pw = Path("/tmp/iris_new_pw").read_text(encoding="utf-8")
          print(json.dumps({
              "provider": "basic",
              "username": "admin",
              "password": pw,
              "next": "/chat",
          }))
          PY
          )
          rm -f /tmp/iris_new_pw

          code=$(curl -sS -m 20 -o /tmp/login_body.json -w "%{http_code}" \
            -X POST http://127.0.0.1:8080/auth/password-login \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "LOGIN_HTTP=$code"
          head -c 160 /tmp/login_body.json; echo
          docker exec selectel-hermes-1 python3 -c \
            'import os; print("USER", os.environ.get("HERMES_DASHBOARD_BASIC_AUTH_USERNAME")); print("PASS_LEN", len(os.environ.get("HERMES_DASHBOARD_BASIC_AUTH_PASSWORD") or ""))'
          test "$code" = "200"
          REMOTE
