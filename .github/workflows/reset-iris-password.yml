name: Reset Iris dashboard password

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: "New HERMES_DASHBOARD_BASIC_AUTH_PASSWORD"
        required: true
        default: "adminadmin"

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set password on VDS and verify login
        env:
          HOST: ${{ secrets.SELECTEL_IRIS_HOST }}
          USER: ${{ secrets.SELECTEL_IRIS_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_IRIS_SSH_KEY }}
          NEW_PASSWORD: ${{ inputs.new_password }}
        run: |
          set -euo pipefail
          test -n "${NEW_PASSWORD}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH=(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ConnectTimeout=45)

          printf '%s' "$NEW_PASSWORD" | "${SSH[@]}" "${USER}@${HOST}" \
            'cat > /tmp/iris_new_pw && chmod 600 /tmp/iris_new_pw'

          "${SSH[@]}" "${USER}@${HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -f /tmp/iris_new_pw
          sudo python3 - <<'PY'
          from pathlib import Path
          pw = Path("/tmp/iris_new_pw").read_text(encoding="utf-8")
          for path in (
              Path("/root/deploy.env"),
              Path("/opt/iris_hermes/deploy/selectel/.env"),
          ):
              if not path.is_file():
                  print(f"skip missing {path}")
                  continue
              lines = path.read_text(encoding="utf-8").splitlines()
              out, hit_pw, hit_user = [], False, False
              for line in lines:
                  if line.startswith("HERMES_DASHBOARD_BASIC_AUTH_PASSWORD="):
                      out.append("HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=" + pw)
                      hit_pw = True
                  elif line.startswith("HERMES_DASHBOARD_BASIC_AUTH_USERNAME="):
                      out.append("HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin")
                      hit_user = True
                  else:
                      out.append(line)
              if not hit_user:
                  out.append("HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin")
              if not hit_pw:
                  out.append("HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=" + pw)
              path.write_text("\n".join(out) + "\n", encoding="utf-8")
              print(f"patched {path}")
          PY

          # Compose reads deploy/selectel/.env; boot path copies from /root/deploy.env.
          sudo cp /root/deploy.env /opt/iris_hermes/deploy/selectel/.env
          sudo chmod 600 /opt/iris_hermes/deploy/selectel/.env
          cd /opt/iris_hermes/deploy/selectel
          sudo docker compose up -d --force-recreate --no-build hermes

          echo "waiting for dashboard inside container…"
          ok=0
          for i in $(seq 1 40); do
            if sudo docker exec selectel-hermes-1 python3 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/api/status", timeout=3).read(100)'; then
              echo "dashboard up attempt=$i"
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

          sudo docker exec -i selectel-hermes-1 python3 - <<'PY2'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          # password file was on host; pass via env file copied into container
          print("USER", os.environ.get("HERMES_DASHBOARD_BASIC_AUTH_USERNAME"))
          pw = os.environ.get("HERMES_DASHBOARD_BASIC_AUTH_PASSWORD") or ""
          print("PASS_LEN", len(pw))
          body = json.dumps({"provider":"basic","username":"admin","password":pw,"next":"/chat"}).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:8080/auth/password-login",
              data=body,
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = resp.read().decode()[:200]
                  print("LOGIN_HTTP", resp.status)
                  print("LOGIN_BODY", data)
                  raise SystemExit(0 if resp.status == 200 else 1)
          except urllib.error.HTTPError as e:
              print("LOGIN_HTTP", e.code)
              print("LOGIN_BODY", e.read().decode()[:200])
              raise SystemExit(1)
          PY2
          rm -f /tmp/iris_new_pw
          REMOTE
