name: Reboot Iris Yandex VDS

# One-shot host reboot when local SSH/yc cannot reach the VDS.
on:
  workflow_dispatch:

jobs:
  reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH reboot
        env:
          HOST: ${{ secrets.SELECTEL_IRIS_HOST }}
          USER: ${{ secrets.SELECTEL_IRIS_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_IRIS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}"
          test -n "${USER:-}"
          test -n "${SSH_KEY:-}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH=(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ConnectTimeout=45 \
               -o StrictHostKeyChecking=accept-new)
          echo "Probing ${USER}@${HOST}…"
          BEFORE=$("${SSH[@]}" "${USER}@${HOST}" 'hostname; uptime -s; cat /proc/sys/kernel/random/boot_id')
          echo "BEFORE:"
          echo "$BEFORE"
          # Soft reboot often no-ops without a TTY; force via systemd.
          "${SSH[@]}" "${USER}@${HOST}" \
            'sudo -n /bin/systemctl reboot --force --force || sudo -n /sbin/reboot -f' \
            || true
          echo "Waiting for SSH drop + new boot_id…"
          sleep 35
          for i in $(seq 1 30); do
            AFTER=$("${SSH[@]}" "${USER}@${HOST}" 'echo UP; uptime -s; cat /proc/sys/kernel/random/boot_id' 2>/dev/null || true)
            if echo "$AFTER" | grep -q '^UP$'; then
              echo "AFTER attempt $i:"
              echo "$AFTER"
              OLD_ID=$(echo "$BEFORE" | tail -1)
              NEW_ID=$(echo "$AFTER" | tail -1)
              if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "$NEW_ID" ]; then
                echo "VDS rebooted OK (boot_id changed)"
                exit 0
              fi
              echo "SSH up but boot_id unchanged — reboot did not take"
              exit 2
            fi
            echo "attempt $i: still down"
            sleep 10
          done
          echo "VDS did not answer SSH within ~5m after reboot signal"
          exit 1
