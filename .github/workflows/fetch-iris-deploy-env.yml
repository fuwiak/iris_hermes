name: Fetch Iris deploy.env

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull /root/deploy.env
        env:
          HOST: ${{ secrets.SELECTEL_IRIS_HOST }}
          USER: ${{ secrets.SELECTEL_IRIS_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_IRIS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ConnectTimeout=45 \
            "${USER}@${HOST}" 'sudo cat /root/deploy.env' > out/deploy.env
          test -s out/deploy.env
          wc -l out/deploy.env
          # Do not print secret values to the log.
          grep -E '^[A-Z0-9_]+=' out/deploy.env | cut -d= -f1 | sort

      - name: Upload deploy.env artifact
        uses: actions/upload-artifact@v4
        with:
          name: selectel-iris-deploy-env
          path: out/deploy.env
          retention-days: 1
